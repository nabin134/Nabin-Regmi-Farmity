<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Farmity</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --otp-bg: #f0fdf4;
            --otp-card: #ffffff;
            --otp-primary: #15803d;
            --otp-primary-light: #dcfce7;
            --otp-primary-dark: #166534;
            --otp-text: #1c1917;
            --otp-muted: #57534e;
            --otp-border: #e7e5e4;
            --otp-radius: 16px;
            --otp-radius-sm: 10px;
            --otp-shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --otp-shadow-lg: 0 25px 50px -12px rgba(0,0,0,0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--otp-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .otp-page {
            width: 100%;
            max-width: 460px;
            background: var(--otp-card);
            border-radius: var(--otp-radius);
            box-shadow: var(--otp-shadow-lg);
            overflow: hidden;
            border: 1px solid var(--otp-border);
        }
        .otp-header {
            background: linear-gradient(135deg, var(--otp-primary) 0%, var(--otp-primary-dark) 100%);
            padding: 2rem 2rem 2.25rem;
            text-align: center;
            color: #fff;
        }
        .otp-header .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }
        .otp-header .logo-img {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 8px;
            object-fit: contain;
        }
        .otp-header .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .otp-header .icon-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .otp-header .icon-wrap i { font-size: 1.75rem; }
        .otp-header h1 {
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }
        .otp-header p {
            font-size: 0.9rem;
            opacity: 0.9;
            line-height: 1.45;
        }
        .otp-body {
            padding: 2rem 2rem 2.5rem;
        }
        .otp-body h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--otp-text);
            margin-bottom: 0.25rem;
        }
        .otp-body .subtitle {
            font-size: 0.9rem;
            color: var(--otp-muted);
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }
        #devOtpBanner {
            display: none;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 0.9rem 1rem;
            border-radius: var(--otp-radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        #devOtpBanner.show { display: block; }
        #devOtpBanner strong { display: block; margin-bottom: 0.25rem; }
        #devOtpBanner .dev-otp-code {
            font-family: ui-monospace, monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            margin-top: 0.35rem;
        }
        .otp-inputs {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 1.75rem;
        }
        .otp-input {
            width: 48px;
            height: 52px;
            border: 2px solid var(--otp-border);
            border-radius: var(--otp-radius-sm);
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            font-family: ui-monospace, monospace;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .otp-input:focus {
            outline: none;
            border-color: var(--otp-primary);
            box-shadow: 0 0 0 3px var(--otp-primary-light);
        }
        .otp-input::placeholder { color: #a8a29e; }
        .otp-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .resend-link {
            color: var(--otp-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s, text-decoration 0.2s;
        }
        .resend-link:hover { color: var(--otp-primary-dark); text-decoration: underline; }
        .resend-link:disabled, .resend-link.resend-wait {
            opacity: 0.6;
            pointer-events: none;
        }
        .btn-verify {
            padding: 0.75rem 1.75rem;
            background: linear-gradient(135deg, var(--otp-primary) 0%, var(--otp-primary-dark) 100%);
            color: #fff;
            border: none;
            border-radius: var(--otp-radius-sm);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .btn-verify:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.35);
        }
        .btn-verify:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            padding: 0.85rem 1rem;
            border-radius: var(--otp-radius-sm);
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            line-height: 1.45;
        }
        .message.show { display: block; }
        .message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--otp-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 1rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--otp-primary); }
        @media (max-width: 480px) {
            .otp-inputs { gap: 0.4rem; }
            .otp-input { width: 42px; height: 48px; font-size: 1.2rem; }
            .otp-header, .otp-body { padding-left: 1.5rem; padding-right: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="otp-page">
        <div class="otp-header">
            <div class="logo-row">
                <img src="/static/images/Farmity%20logo.png" alt="Farmity" class="logo-img" onerror="this.style.display='none'">
                <span class="logo-text">Farmity</span>
            </div>
            <div class="icon-wrap"><i class="fas fa-key"></i></div>
            <h1>Password reset</h1>
            <p>Enter the 6-digit code we sent to your email to continue.</p>
        </div>
        <div class="otp-body">
            <h2>Enter verification code</h2>
            <p class="subtitle">Check your inbox for the code. It expires in 10 minutes.</p>

            <div id="devOtpBanner" class="dev-banner">
                <strong>Email not received?</strong>
                Use this code to continue (development mode):
                <div class="dev-otp-code" id="devOtpCode"></div>
            </div>

            <div id="message" class="message"></div>

            <form id="otpForm">
                {% csrf_token %}
                <input type="hidden" id="email" name="email" value="{{ email|default:'' }}">
                <input type="hidden" id="token" name="token" value="{{ token|default:'' }}">
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="otp1" required autocomplete="one-time-code">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="otp2" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="otp3" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="otp4" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="otp5" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="otp6" required>
                </div>
                <div class="otp-actions">
                    <a href="#" class="resend-link" id="resendLink">Resend code</a>
                    <button type="submit" class="btn-verify" id="verifyBtn">Verify</button>
                </div>
            </form>
            <a href="/forgot-password/" class="back-link"><i class="fas fa-arrow-left"></i> Back to forgot password</a>
        </div>
    </div>

    <script>
        (function() {
            const otpInputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otpForm');
            const verifyBtn = document.getElementById('verifyBtn');
            const messageDiv = document.getElementById('message');
            const resendLink = document.getElementById('resendLink');
            const emailInput = document.getElementById('email');
            const tokenInput = document.getElementById('token');

            function getParam(name) {
                return new URLSearchParams(window.location.search).get(name) || '';
            }
            function setMessage(text, type) {
                if (!messageDiv) return;
                messageDiv.textContent = text;
                messageDiv.className = 'message show ' + (type || '');
            }
            function hideMessage() {
                if (messageDiv) { messageDiv.textContent = ''; messageDiv.className = 'message'; }
            }

            // Show dev OTP from URL if present (when email failed in DEBUG)
            const devOtp = getParam('dev_otp');
            if (devOtp && devOtp.length === 6) {
                const banner = document.getElementById('devOtpBanner');
                const codeEl = document.getElementById('devOtpCode');
                if (banner && codeEl) {
                    codeEl.textContent = devOtp;
                    banner.classList.add('show');
                }
            }

            // Set email/token from URL if not in form
            if (emailInput && !emailInput.value) emailInput.value = getParam('email');
            if (tokenInput && !tokenInput.value) tokenInput.value = getParam('token');

            otpInputs.forEach(function(input, index) {
                input.addEventListener('input', function() {
                    if (this.value.length === 1 && index < otpInputs.length - 1) otpInputs[index + 1].focus();
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) otpInputs[index - 1].focus();
                });
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    var paste = (e.clipboardData || window.clipboardData).getData('text');
                    var digits = paste.replace(/\D/g, '').slice(0, 6);
                    digits.split('').forEach(function(d, i) {
                        if (otpInputs[i]) otpInputs[i].value = d;
                    });
                    if (digits.length === 6) otpInputs[5].focus();
                    else if (digits.length > 0) otpInputs[digits.length - 1].focus();
                });
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var otp = Array.from(otpInputs).map(function(i) { return i.value; }).join('');
                var email = (emailInput && emailInput.value.trim()) || getParam('email');
                var token = (tokenInput && tokenInput.value) || getParam('token');
                email = email ? email.toLowerCase() : '';

                if (otp.length !== 6) {
                    setMessage('Please enter all 6 digits.', 'error');
                    return;
                }
                if (!email) {
                    setMessage('Email is required. Please go back and try again.', 'error');
                    return;
                }

                if (verifyBtn) { verifyBtn.disabled = true; verifyBtn.textContent = 'Verifying…'; }
                hideMessage();

                try {
                    var csrf = document.querySelector('[name=csrfmiddlewaretoken]');
                    var csrftoken = csrf ? csrf.value : '';
                    var response = await fetch('/api/auth/verify-reset-otp/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                        body: JSON.stringify({ email: email, otp: otp, token: token })
                    });
                    var data = await response.json();

                    if (response.ok) {
                        setMessage('Verified! Redirecting…', 'success');
                        var resetToken = data.reset_token || token;
                        if (resetToken) {
                            setTimeout(function() {
                                window.location.href = '/reset-password/?token=' + encodeURIComponent(resetToken);
                            }, 800);
                        } else {
                            setMessage('No reset token received. Please try again.', 'error');
                            if (verifyBtn) { verifyBtn.disabled = false; verifyBtn.textContent = 'Verify'; }
                        }
                    } else {
                        setMessage(data.error || 'Invalid or expired code. Please try again.', 'error');
                        otpInputs.forEach(function(i) { i.value = ''; });
                        if (otpInputs[0]) otpInputs[0].focus();
                        if (verifyBtn) { verifyBtn.disabled = false; verifyBtn.textContent = 'Verify'; }
                    }
                } catch (err) {
                    setMessage('Network error. Please check your connection.', 'error');
                    if (verifyBtn) { verifyBtn.disabled = false; verifyBtn.textContent = 'Verify'; }
                }
            });

            resendLink.addEventListener('click', async function(e) {
                e.preventDefault();
                var email = (emailInput && emailInput.value.trim()) || getParam('email');
                email = email ? email.toLowerCase() : '';
                if (!email) {
                    setMessage('Email is required. Please go back and try again.', 'error');
                    return;
                }
                resendLink.classList.add('resend-wait');
                resendLink.style.pointerEvents = 'none';
                hideMessage();
                try {
                    var csrf = document.querySelector('[name=csrfmiddlewaretoken]');
                    var res = await fetch('/api/auth/forgot-password/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': (csrf && csrf.value) || '' },
                        body: JSON.stringify({ email: email })
                    });
                    var data = await res.json();
                    if (res.ok) {
                        setMessage('New code sent. Check your email.', 'success');
                        if (data.token && tokenInput) tokenInput.value = data.token;
                        if (data.dev_otp) {
                            var banner = document.getElementById('devOtpBanner');
                            var codeEl = document.getElementById('devOtpCode');
                            if (banner && codeEl) { codeEl.textContent = data.dev_otp; banner.classList.add('show'); }
                        }
                        otpInputs.forEach(function(i) { i.value = ''; });
                        if (otpInputs[0]) otpInputs[0].focus();
                    } else {
                        setMessage(data.error || 'Failed to resend. Try again.', 'error');
                    }
                } catch (err) {
                    setMessage('Network error. Please try again.', 'error');
                }
                setTimeout(function() {
                    resendLink.classList.remove('resend-wait');
                    resendLink.style.pointerEvents = '';
                }, 60000);
            });
        })();
    </script>
</body>
</html>
