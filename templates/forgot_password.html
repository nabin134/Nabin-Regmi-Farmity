<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Farmity</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --farmity-green: #3C9246;
            --farmity-green-dark: #2d6b38;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .forgot-password-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        /* Left Panel - Green */
        .left-panel {
            flex: 1;
            background: linear-gradient(160deg, var(--farmity-green) 0%, var(--farmity-green-dark) 100%);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            min-height: 500px;
        }

        .left-panel .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            background: #f2f2f2;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            box-shadow: none;
        }

        .left-panel .logo-img {
            width: 50px;
            height: 50px;
            background: #f2f2f2;
            border-radius: 8px;
            padding: 8px;
        }

        .left-panel .logo-text {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--farmity-green);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .left-panel h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }

        .left-panel p {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            max-width: 400px;
        }

        /* Right Panel - White */
        .right-panel {
            flex: 1.5;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-panel .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--farmity-green);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .right-panel h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
        }

        .right-panel .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1.1rem;
            z-index: 1;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #1a1a1a;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--farmity-green);
            box-shadow: 0 0 0 4px rgba(60, 146, 70, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--farmity-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--farmity-green-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(60, 146, 70, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #374151;
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--farmity-green);
        }

        .back-link i {
            font-size: 0.9rem;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #a7f3d0;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #fca5a5;
            display: block;
        }

        @media (max-width: 768px) {
            .forgot-password-wrapper {
                flex-direction: column;
            }

            .left-panel {
                min-height: 300px;
                padding: 2rem;
            }

            .left-panel h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-password-wrapper">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="logo">
                <img src="/static/images/Farmity%20logo.png" alt="Farmity" class="logo-img" onerror="this.style.display='none';">
                <span class="logo-text">Farmity</span>
            </div>
            <h1>Reconnect with Farmity</h1>
            <p>Your trusted partner for fresh, local produce. We help you stay connected to sustainable farming.</p>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="brand-text">Farmity</div>
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your email address below and we'll send you a One-Time Password (OTP) to reset your password.</p>

            <div id="message" class="message"></div>

            <form id="forgotPasswordForm">
                {% csrf_token %}
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Email address" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">Send OTP</button>

                <a href="/login/" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Sign In
                </a>
            </form>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        /* Real-time email validation: global init in main.js (single listener, single message). */

        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const emailInput = form.querySelector('#email');
            const submitButton = form.querySelector('#submitBtn');
            const messageDiv = document.getElementById('message');
            
            const email = emailInput.value.trim();
            
            // Clear previous messages
            if (messageDiv) {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }
            
            // FormValidator shows one inline message below the field
            if (!window.FormValidator.validateEmail(emailInput, true)) {
                return;
            }
            
            // Disable button
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Sending...';
            }
            
            // Clear previous messages
            if (messageDiv) {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }
            
            try {
                const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                
                const response = await fetch('/api/auth/forgot-password/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (messageDiv) {
                        messageDiv.textContent = data.message || 'OTP has been sent to your email. Please check your inbox.';
                        messageDiv.className = 'message success';
                    }
                    setTimeout(() => {
                        const token = data.token || '';
                        let url = `/otp-verification/?email=${encodeURIComponent(email)}`;
                        if (token) url += `&token=${encodeURIComponent(token)}`;
                        window.location.href = url;
                    }, 2000);
                } else {
                    if (messageDiv) {
                        messageDiv.textContent = data.error || 'An error occurred. Please try again.';
                        messageDiv.className = 'message error';
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                if (messageDiv) {
                    messageDiv.textContent = 'Network error. Please check your connection.';
                    messageDiv.className = 'message error';
                }
            } finally {
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Send OTP';
                }
            }
        });
    </script>
</body>
</html>
