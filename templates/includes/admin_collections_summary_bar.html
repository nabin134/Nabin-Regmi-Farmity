{% if request.user.is_authenticated and request.user.role == 'admin' %}
<div class="admin-collections-summary-bar" style="background: linear-gradient(135deg, #358D58 0%, #2a6f45 100%); color: white; padding: 12px 20px; margin: 0 0 20px 0; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; box-shadow: 0 2px 10px rgba(53,141,88,0.25);">
    <span style="font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-money-bill-wave"></i> Collections & Payouts
    </span>
    <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
        <span><strong>Collected:</strong> Rs. {{ admin_total_collected|floatformat:2 }}</span>
        <span><strong>Pending:</strong> Rs. {{ admin_total_pending_payout|floatformat:2 }}</span>
        <span><strong>Paid out:</strong> Rs. {{ admin_total_paid_out|floatformat:2 }}</span>
        <a href="{% url 'admin_collections_payouts' %}" style="background: rgba(255,255,255,0.95); color: #358D58; padding: 8px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fas fa-external-link-alt"></i> View full page
        </a>
    </div>
</div>
{% endif %}
