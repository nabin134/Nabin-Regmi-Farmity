<style>
.admin-messages {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    padding: 0.75rem 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    max-height: 40vh;
    overflow-y: auto;
    transition: opacity 0.3s ease;
}
.admin-messages.messages-hidden { opacity: 0; pointer-events: none; }
.admin-messages .message-alert {
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    border-left: 4px solid #28a745;
}
.admin-messages .message-alert:last-child { margin-bottom: 0; }
.admin-messages .message-alert.success { background: #D4EDDA; color: #155724; border-left-color: #28A745; }
.admin-messages .message-alert.error { background: #F8D7DA; color: #721C24; border-left-color: #DC3545; }
.admin-messages .message-alert.warning { background: #FFF3CD; color: #856404; border-left-color: #FFC107; }
.admin-messages .message-alert.info { background: #D1ECF1; color: #0C5460; border-left-color: #17a2b8; }
</style>
{% if messages %}
<div class="admin-messages messages-auto-dismiss" data-dismiss-ms="3000">
    {% for message in messages %}
    <div class="message-alert {{ message.tags }}" role="alert">{{ message }}</div>
    {% endfor %}
</div>
<script>
(function(){
    var el = document.querySelector('.admin-messages.messages-auto-dismiss');
    if (!el) return;
    var ms = parseInt(el.getAttribute('data-dismiss-ms') || '3000', 10);
    setTimeout(function(){ el.classList.add('messages-hidden'); setTimeout(function(){ el.style.display = 'none'; }, 300); }, ms);
})();
</script>
{% endif %}
