{% load static %}
<style>
.notif-bell-wrap { position: relative; display: inline-block; margin-right: 1rem; }
.notif-bell-btn {
    width: 42px; height: 42px;
    border: none; background: #f1f5f9; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #475569; font-size: 1.15rem; transition: background 0.2s, color 0.2s;
}
.notif-bell-btn:hover { background: #e2e8f0; color: #358D58; }
.notif-bell-badge {
    position: absolute; top: -2px; right: -2px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: #dc2626; color: #fff; font-size: 0.7rem; font-weight: 700;
    border-radius: 9px; display: none; align-items: center; justify-content: center;
}
.notif-bell-badge.show { display: flex; }
.notif-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 360px; max-width: 95vw; max-height: 400px;
    background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    border: 1px solid #e2e8f0; z-index: 10001; display: none; flex-direction: column;
}
.notif-dropdown.open { display: flex; }
.notif-dropdown-header {
    padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center;
}
.notif-dropdown-header h4 { margin: 0; font-size: 0.95rem; font-weight: 700; color: #1e293b; }
.notif-mark-all { font-size: 0.8rem; color: #358D58; background: none; border: none; cursor: pointer; font-weight: 600; }
.notif-mark-all:hover { text-decoration: underline; }
.notif-list { overflow-y: auto; max-height: 320px; }
.notif-item {
    padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9;
    cursor: pointer; transition: background 0.15s; display: block; text-decoration: none; color: inherit;
}
.notif-item:hover { background: #f8fafc; }
.notif-item.unread { background: #f0fdf4; }
.notif-item-title { font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-bottom: 0.2rem; }
.notif-item-meta { font-size: 0.75rem; color: #64748b; }
.notif-empty { padding: 1.5rem 1rem; text-align: center; color: #94a3b8; font-size: 0.9rem; }
</style>
<div class="notif-bell-wrap">
    <button type="button" class="notif-bell-btn" id="notifBellBtn" aria-label="Notifications">
        <i class="fas fa-bell"></i>
    </button>
    <span class="notif-bell-badge" id="notifBellBadge">0</span>
    <div class="notif-dropdown" id="notifDropdown">
        <div class="notif-dropdown-header">
            <h4>Notifications</h4>
            <button type="button" class="notif-mark-all" id="notifMarkAllRead">Mark all read</button>
        </div>
        <div class="notif-list" id="notifList">
            <div class="notif-empty">Loading…</div>
        </div>
    </div>
</div>
<script>
(function() {
    var listEl = document.getElementById('notifList');
    var badgeEl = document.getElementById('notifBellBadge');
    var dropdownEl = document.getElementById('notifDropdown');
    var btnEl = document.getElementById('notifBellBtn');
    var markAllBtn = document.getElementById('notifMarkAllRead');
    var listUrl = '{% url "api_notifications_list" %}';
    var markReadUrlTemplate = '{% url "api_notification_mark_read" 1 %}';
    var markReadUrlBase = markReadUrlTemplate.replace(/\/1\/read\/$/, '/');
    var markAllReadUrl = '{% url "api_notification_mark_all_read" %}';

    function fetchNotifications() {
        fetch(listUrl, { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var items = data.notifications || [];
                var unread = data.unread_count || 0;
                if (badgeEl) {
                    badgeEl.textContent = unread > 99 ? '99+' : unread;
                    badgeEl.classList.toggle('show', unread > 0);
                }
                if (!listEl) return;
                if (items.length === 0) {
                    listEl.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
                    return;
                }
                listEl.innerHTML = items.map(function(n) {
                    var href = '#';
                    if (n.link) {
                        if (n.link.startsWith('http')) href = n.link;
                        else if (n.link.startsWith('#')) href = window.location.pathname + window.location.search + n.link;
                        else if (n.link.startsWith('?')) href = window.location.pathname + n.link;
                        else href = n.link.indexOf('/') !== -1 ? n.link : (window.location.pathname + (n.link.startsWith('?') ? n.link : '?' + n.link));
                    }
                    var extra = n.message ? '<div class="notif-item-meta">' + escapeHtml(n.message) + '</div>' : '';
                    return '<a class="notif-item' + (n.is_read ? '' : ' unread') + '" data-id="' + n.id + '" href="' + escapeHtml(href) + '">' +
                        '<div class="notif-item-title">' + escapeHtml(n.title) + '</div>' +
                        extra +
                        '<div class="notif-item-meta">' + escapeHtml(n.created_at) + '</div></a>';
                }).join('');
            })
            .catch(function() {
                if (listEl) listEl.innerHTML = '<div class="notif-empty">Could not load notifications.</div>';
            });
    }

    function escapeHtml(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function markRead(id) {
        fetch(markReadUrlBase + id + '/read/', { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRFToken': getCookie('csrftoken'), 'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'csrfmiddlewaretoken=' + encodeURIComponent(getCookie('csrftoken')) })
            .then(function() { fetchNotifications(); });
    }

    function getCookie(name) {
        var v = document.cookie.match('(?:^|; )\\s*' + name + '=([^;]*)');
        return v ? v[1] : '';
    }

    if (btnEl && dropdownEl) {
        btnEl.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdownEl.classList.toggle('open');
            if (dropdownEl.classList.contains('open')) fetchNotifications();
        });
    }
    document.addEventListener('click', function() {
        if (dropdownEl) dropdownEl.classList.remove('open');
    });
    if (dropdownEl) dropdownEl.addEventListener('click', function(e) { e.stopPropagation(); });

    if (listEl) {
        listEl.addEventListener('click', function(e) {
            var a = e.target.closest('.notif-item[data-id]');
            if (a && a.dataset.id) markRead(a.dataset.id);
        });
    }
    if (markAllBtn) {
        markAllBtn.addEventListener('click', function(e) {
            e.preventDefault();
            fetch(markAllReadUrl, { method: 'POST', credentials: 'same-origin', headers: { 'X-CSRFToken': getCookie('csrftoken'), 'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'csrfmiddlewaretoken=' + encodeURIComponent(getCookie('csrftoken')) })
                .then(function() { fetchNotifications(); });
        });
    }

    fetchNotifications();
})();
</script>
