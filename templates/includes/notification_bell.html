{% load static %}
<style>
/* ---- Notification system: professional UI ---- */
:root {
    --notif-primary: #0d9488;
    --notif-primary-hover: #0f766e;
    --notif-bg: #ffffff;
    --notif-border: rgba(0, 0, 0, 0.06);
    --notif-text: #0f172a;
    --notif-text-muted: #64748b;
    --notif-text-light: #94a3b8;
    --notif-surface: #f8fafc;
    --notif-surface-hover: #f1f5f9;
    --notif-radius: 12px;
    --notif-radius-sm: 8px;
    --notif-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --notif-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

.notif-bell-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
}

.notif-bell-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--notif-border);
    background: var(--notif-bg);
    border-radius: var(--notif-radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--notif-text-muted);
    font-size: 1.1rem;
    transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    box-shadow: var(--notif-shadow);
}

.notif-bell-btn:hover {
    color: var(--notif-primary);
    background: var(--notif-surface);
    border-color: rgba(13, 148, 136, 0.2);
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.12);
}

.notif-bell-btn:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--notif-bg), 0 0 0 4px rgba(13, 148, 136, 0.35);
}

.notif-bell-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 18px;
    border-radius: 9px;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 4px rgba(220, 38, 38, 0.35);
    border: 2px solid var(--notif-bg);
}

.notif-bell-badge.show {
    display: flex;
    animation: notif-badge-in 0.25s ease;
}

@keyframes notif-badge-in {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.notif-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 420px;
    max-width: min(95vw, 420px);
    max-height: 520px;
    background: var(--notif-bg);
    border-radius: var(--notif-radius);
    border: 1px solid var(--notif-border);
    box-shadow: var(--notif-shadow-lg);
    z-index: 10001;
    display: none;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.notif-dropdown.open {
    display: flex;
    opacity: 1;
    transform: translateY(0);
}

.notif-dropdown-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--notif-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, #f0fdfa 0%, var(--notif-surface) 100%);
    flex-shrink: 0;
}

.notif-dropdown-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    color: var(--notif-text);
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.notif-dropdown-title i {
    color: var(--notif-primary);
    font-size: 1rem;
    opacity: 0.95;
}

.notif-mark-all {
    font-size: 0.8125rem;
    color: var(--notif-primary);
    background: transparent;
    border: none;
    cursor: pointer;
    font-weight: 600;
    padding: 0.375rem 0.625rem;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
}

.notif-mark-all:hover {
    background: rgba(13, 148, 136, 0.1);
    color: var(--notif-primary-hover);
}

.notif-mark-all:focus {
    outline: none;
}

.notif-list {
    overflow-y: auto;
    max-height: 400px;
    overscroll-behavior: contain;
}

.notif-list::-webkit-scrollbar {
    width: 6px;
}

.notif-list::-webkit-scrollbar-track {
    background: transparent;
}

.notif-list::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
}

.notif-list::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

.notif-item {
    position: relative;
    padding: 0;
    border-bottom: 1px solid var(--notif-border);
    transition: background 0.15s ease;
    display: flex;
    color: inherit;
    align-items: flex-start;
    gap: 0.875rem;
    min-height: 0;
    background: var(--notif-bg);
}

.notif-item:last-child {
    border-bottom: none;
}

.notif-item:hover {
    background: var(--notif-surface-hover);
}

.notif-item.unread {
    background: rgba(13, 148, 136, 0.05);
}

.notif-item.unread::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--notif-primary);
    border-radius: 0 2px 2px 0;
}

.notif-item-icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    margin: 1rem 0 1rem 1rem;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
}

.notif-item-icon.type-order {
    background: rgba(59, 130, 246, 0.14);
    color: #2563eb;
}

.notif-item-icon.type-chat {
    background: rgba(99, 102, 241, 0.14);
    color: #4f46e5;
}

.notif-item-icon.type-kyc {
    background: rgba(245, 158, 11, 0.14);
    color: #d97706;
}

.notif-item-icon.type-appointment {
    background: rgba(13, 148, 136, 0.14);
    color: #0d9488;
}

.notif-item-icon.type-support {
    background: rgba(219, 39, 119, 0.12);
    color: #be185d;
}

.notif-item-icon.type-info {
    background: var(--notif-surface);
    color: var(--notif-text-muted);
}

.notif-item-body {
    flex: 1;
    min-width: 0;
    padding: 1rem 1rem 1rem 0;
}

.notif-item-title {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--notif-text);
    margin-bottom: 0.35rem;
    line-height: 1.35;
}

.notif-item.unread .notif-item-title {
    font-weight: 700;
}

.notif-item-message {
    font-size: 0.8125rem;
    color: var(--notif-text-muted);
    line-height: 1.5;
    margin-bottom: 0.5rem;
    max-height: 4.5em;
    overflow-y: auto;
    word-break: break-word;
}

.notif-item-message::-webkit-scrollbar {
    width: 4px;
}

.notif-item-message::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 2px;
}

.notif-item-time {
    font-size: 0.75rem;
    color: var(--notif-text-light);
    font-weight: 500;
    margin-bottom: 0.5rem;
}

.notif-item-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.35rem;
}

.notif-btn-view {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--notif-primary);
    background: rgba(13, 148, 136, 0.1);
    border: 1px solid rgba(13, 148, 136, 0.25);
    padding: 0.35rem 0.65rem;
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.notif-btn-view:hover {
    background: rgba(13, 148, 136, 0.18);
    color: var(--notif-primary-hover);
    border-color: rgba(13, 148, 136, 0.4);
}

.notif-btn-mark-read {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--notif-text-muted);
    background: var(--notif-surface);
    border: 1px solid var(--notif-border);
    padding: 0.3rem 0.55rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.notif-btn-mark-read:hover {
    background: var(--notif-surface-hover);
    color: var(--notif-primary);
    border-color: rgba(13, 148, 136, 0.25);
}

.notif-empty {
    padding: 2.5rem 1.5rem;
    text-align: center;
    color: var(--notif-text-muted);
    font-size: 0.875rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
}

.notif-empty-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--notif-surface);
    color: var(--notif-text-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
}

.notif-empty span {
    max-width: 240px;
}

.notif-loading {
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.625rem;
    color: var(--notif-text-light);
    font-size: 0.875rem;
}

.notif-loading i {
    animation: notif-spin 0.7s linear infinite;
}

@keyframes notif-spin {
    to { transform: rotate(360deg); }
}

.notif-error {
    padding: 2rem 1.5rem;
    text-align: center;
    color: var(--notif-text-muted);
    font-size: 0.875rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
}

.notif-error-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
}
</style>
<div class="notif-bell-wrap">
    <button type="button" class="notif-bell-btn" id="notifBellBtn" aria-label="Notifications" aria-expanded="false" aria-haspopup="true">
        <i class="fas fa-bell"></i>
    </button>
    <span class="notif-bell-badge" id="notifBellBadge" aria-live="polite">0</span>
    <div class="notif-dropdown" id="notifDropdown" role="dialog" aria-label="Notifications panel">
        <div class="notif-dropdown-header">
            <h2 class="notif-dropdown-title"><i class="fas fa-bell"></i> Notifications</h2>
            <button type="button" class="notif-mark-all" id="notifMarkAllRead">Mark all read</button>
        </div>
        <div class="notif-list" id="notifList">
            <div class="notif-loading"><i class="fas fa-circle-notch"></i> Loading…</div>
        </div>
    </div>
</div>
<script>
(function() {
    var listEl = document.getElementById('notifList');
    var badgeEl = document.getElementById('notifBellBadge');
    var dropdownEl = document.getElementById('notifDropdown');
    var btnEl = document.getElementById('notifBellBtn');
    var markAllBtn = document.getElementById('notifMarkAllRead');
    var listUrl = '{% url "api_notifications_list" %}';
    var markReadUrlTemplate = '{% url "api_notification_mark_read" 1 %}';
    var markReadUrlBase = markReadUrlTemplate.replace(/\/1\/read\/$/, '/');
    var markAllReadUrl = '{% url "api_notification_mark_all_read" %}';

    var typeIcons = {
        order: 'fa-shopping-bag',
        chat: 'fa-comments',
        kyc: 'fa-id-card',
        appointment: 'fa-calendar-check',
        support: 'fa-life-ring',
        info: 'fa-info-circle'
    };

    function getIcon(type) {
        return typeIcons[type] || typeIcons.info;
    }

    function buildHref(n) {
        if (!n.link) return '#';
        var link = n.link;
        if (link.startsWith('http')) return link;
        if (link.startsWith('#')) return window.location.pathname + window.location.search + link;
        if (link.startsWith('?')) return window.location.pathname + link;
        return link.indexOf('/') !== -1 ? link : (window.location.pathname + (link.startsWith('?') ? link : '?' + link));
    }

    function escapeHtml(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function fetchNotifications() {
        fetch(listUrl, { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var items = data.notifications || [];
                var unread = data.unread_count || 0;
                if (badgeEl) {
                    badgeEl.textContent = unread > 99 ? '99+' : unread;
                    badgeEl.classList.toggle('show', unread > 0);
                }
                if (btnEl) btnEl.setAttribute('aria-expanded', dropdownEl && dropdownEl.classList.contains('open'));
                if (markAllBtn) markAllBtn.style.visibility = unread > 0 ? 'visible' : 'hidden';
                if (!listEl) return;
                if (items.length === 0) {
                    listEl.innerHTML = '<div class="notif-empty">' +
                        '<div class="notif-empty-icon"><i class="fas fa-bell-slash"></i></div>' +
                        '<span>No notifications yet.<br>We’ll notify you when something happens.</span></div>';
                    return;
                }
                listEl.innerHTML = items.map(function(n) {
                    var href = buildHref(n);
                    var type = (n.type || 'info').toLowerCase();
                    var iconClass = getIcon(type);
                    var unreadClass = n.is_read ? '' : ' unread';
                    var msgHtml = n.message ? '<div class="notif-item-message">' + escapeHtml(n.message) + '</div>' : '';
                    var hasLink = href && href !== '#';
                    var markReadBtn = n.is_read ? '' : '<button type="button" class="notif-btn-mark-read notif-mark-one" data-id="' + n.id + '" title="Mark as read"><i class="fas fa-check"></i> Mark read</button>';
                    var viewBtn = hasLink ? '<a class="notif-btn-view notif-goto-page" href="' + escapeHtml(href) + '" data-id="' + n.id + '"><i class="fas fa-external-link-alt"></i> View page</a>' : '';
                    var actionsHtml = (viewBtn || markReadBtn) ? '<div class="notif-item-actions">' + viewBtn + markReadBtn + '</div>' : '';
                    return '<div class="notif-item' + unreadClass + '" data-id="' + n.id + '" data-href="' + escapeHtml(href) + '">' +
                        '<div class="notif-item-icon type-' + escapeHtml(type) + '"><i class="fas ' + iconClass + '"></i></div>' +
                        '<div class="notif-item-body">' +
                        '<div class="notif-item-title">' + escapeHtml(n.title) + '</div>' +
                        msgHtml +
                        '<div class="notif-item-time">' + escapeHtml(n.created_at) + '</div>' +
                        actionsHtml +
                        '</div></div>';
                }).join('');
            })
            .catch(function() {
                if (listEl) listEl.innerHTML = '<div class="notif-error">' +
                    '<div class="notif-error-icon"><i class="fas fa-exclamation-circle"></i></div>' +
                    '<span>Could not load notifications.<br>Try again later.</span></div>';
            });
    }

    function markRead(id) {
        fetch(markReadUrlBase + id + '/read/', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest',
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'csrfmiddlewaretoken=' + encodeURIComponent(getCookie('csrftoken'))
        }).then(function() { fetchNotifications(); });
    }

    function getCookie(name) {
        var v = document.cookie.match('(?:^|; )\\s*' + name + '=([^;]*)');
        return v ? v[1] : '';
    }

    if (btnEl && dropdownEl) {
        btnEl.addEventListener('click', function(e) {
            e.stopPropagation();
            var open = dropdownEl.classList.toggle('open');
            btnEl.setAttribute('aria-expanded', open);
            if (open) fetchNotifications();
        });
    }
    document.addEventListener('click', function() {
        if (dropdownEl) {
            dropdownEl.classList.remove('open');
            if (btnEl) btnEl.setAttribute('aria-expanded', 'false');
        }
    });
    if (dropdownEl) dropdownEl.addEventListener('click', function(e) { e.stopPropagation(); });

    if (listEl) {
        listEl.addEventListener('click', function(e) {
            var markBtn = e.target.closest('.notif-mark-one');
            if (markBtn && markBtn.dataset.id) {
                e.preventDefault();
                e.stopPropagation();
                markRead(markBtn.dataset.id);
                return;
            }
            var viewBtn = e.target.closest('.notif-goto-page');
            if (viewBtn && viewBtn.dataset.id) {
                var href = viewBtn.getAttribute('href');
                if (href && href !== '#') {
                    e.preventDefault();
                    e.stopPropagation();
                    markRead(viewBtn.dataset.id);
                    window.location.href = href;
                }
                return;
            }
        });
    }
    if (markAllBtn) {
        markAllBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            fetch(markAllReadUrl, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                    'X-Requested-With': 'XMLHttpRequest',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'csrfmiddlewaretoken=' + encodeURIComponent(getCookie('csrftoken'))
            }).then(function() { fetchNotifications(); });
        });
    }

    fetchNotifications();
})();
</script>
