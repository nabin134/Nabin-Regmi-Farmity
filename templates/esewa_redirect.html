<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSewa — Farmity</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { font-family: system-ui, sans-serif; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f5; padding: 1rem; }
        .box { background: #fff; border-radius: 12px; padding: 1.75rem; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
        .box h1 { font-size: 1.15rem; margin: 0 0 0.5rem; color: #333; }
        .amt { font-size: 1.5rem; font-weight: 700; color: #3C894B; margin: 0.75rem 0; }
        .muted { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
        button { width: 100%; padding: 0.85rem; border: none; border-radius: 8px; background: #5B5FEF; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.7; cursor: wait; }
        a { color: #3C894B; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Pay with eSewa</h1>
        <p class="amt">Rs. {{ total_amount|floatformat:2 }}</p>
        {% if order_count > 1 %}<p class="muted">{{ order_count }} orders</p>{% endif %}
        <form id="esewaForm" method="POST" action="{{ form_url }}">
            {% for key, value in form_data.items %}
            <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endfor %}
            <button type="submit" id="btn">Continue to eSewa</button>
        </form>
        <p class="muted" style="margin-top:1rem;"><a href="/">Cancel</a></p>
    </div>
    <script>
        document.getElementById('esewaForm').addEventListener('submit', function () {
            document.getElementById('btn').disabled = true;
        });
    </script>
</body>
</html>
