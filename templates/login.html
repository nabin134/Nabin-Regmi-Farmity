{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Farmity</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #3C894B;
            --secondary-green: #2d6b3d;
            --light-grey: #f0f2f5;
            --text-dark: #333333;
            --text-grey: #777777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--secondary-green) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-card h1 {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 2.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .input-wrapper {
            background: var(--light-grey);
            border-radius: 50px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background: #e8eaed;
            box-shadow: 0 0 0 2px rgba(60, 137, 75, 0.2);
        }

        .input-wrapper i {
            color: var(--text-grey);
            font-size: 1.1rem;
            width: 24px;
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            padding: 1rem 0.75rem;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .input-wrapper input::placeholder {
            color: #aaaaaa;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.5rem;
            margin: 1.5rem 0.5rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-wrapper input {
            display: none;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            background: #ffcc66; /* Match the orange from image or use primary */
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.75rem;
            transition: all 0.2s ease;
        }

        .checkbox-wrapper input:checked + .custom-checkbox {
            background: var(--primary-green);
        }

        .custom-checkbox i {
            color: white;
            font-size: 0.8rem;
            display: none;
        }

        .checkbox-wrapper input:checked + .custom-checkbox i {
            display: block;
        }

        .checkbox-wrapper span {
            color: var(--text-grey);
            font-size: 0.95rem;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(to right, #ffbb33, #ff4444); /* Keep original gradient as per user preference or use green? User said "dont change the colour" - I'll stick to Green gradient for button too to be safe, but they might want the image colors. Wait, "dont change the colour" usually means their primary brand color. I'll use a nice green gradient. */
            background: linear-gradient(to right, #4CAF50, #2E7D32);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(60, 137, 75, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(60, 137, 75, 0.4);
        }

        .forgot-password {
            display: block;
            color: var(--text-grey);
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 4rem;
        }

        .signup-text {
            color: var(--text-grey);
            font-size: 0.95rem;
        }

        .signup-text a {
            color: #6688ff;
            text-decoration: none;
            font-weight: 600;
        }

        /* Error Message Styling */
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Login</h1>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <div class="input-wrapper">
                    <i class="far fa-user"></i>
                    <input type="email" id="email" name="email" placeholder="Username" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" name="remember">
                    <div class="custom-checkbox">
                        <i class="fas fa-check"></i>
                    </div>
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Log In</button>
            
            <a href="{% url 'forgot_password' %}" class="forgot-password">Forget Password</a>

            <div class="signup-text">
                Not a member? <a href="{% url 'role-selection' %}">Sign up now</a>
            </div>
        </form>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            errorDiv.style.display = 'none';

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': data.csrfmiddlewaretoken
                    },
                    body: JSON.stringify({
                        email: data.email,
                        password: data.password
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    // Save user data
                    localStorage.setItem('user', JSON.stringify(result.user));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // Redirect based on role or next parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const next = urlParams.get('next');
                    window.location.href = next || result.redirect_url || '/dashboard/';
                } else {
                    errorDiv.textContent = result.error || 'Login failed. Please try again.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'An error occurred. Please try again later.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
